name: GA LNS v2 source-event destroy-repair versus random-bundle control
on:
  push:
    branches:
      - diagnostics/scheduling-aware-lns-20261010
    paths:
      - .github/workflows/ga-lns-destroy-repair-v2-20261010.yml
      - src/la_grid/diagnostics/ga_schedule_aware_lns_repair_v2_20261010.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [900,901,902,903]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Restore the protected 64-sample planning input files
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for name in ("Data/JULY_UTILITY_CONSTRAINED_92.csv","Data/substation_graph_CEC_edges_expanded.csv","Data/source_nodes_core_expanded.csv","data/travel/travel_task_to_task.csv","data/travel/travel_base_to_task.csv","Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"):
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"),name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Validate and screen score-based source-route repair
        run: |
          python -m py_compile src/la_grid/diagnostics/ga_schedule_aware_lns_repair_v2_20261010.py
          python -m la_grid.diagnostics.ga_schedule_aware_lns_repair_v2_20261010 --seed ${{ matrix.seed }} --budget 20000
      - name: Preserve four-method pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-lns-repair-v2-smoke-s${{ matrix.seed }}
          path: results/diagnostics/ga_scheduling_aware_lns_20261010/repair_v2/
          if-no-files-found: warn
          retention-days: 21
  confirm:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [920,921,922,923,924,925,926,927,928,929,930,931,932,933,934,935,936,937,938,939]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Restore the same protected planning model files
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for name in ("Data/JULY_UTILITY_CONSTRAINED_92.csv","Data/substation_graph_CEC_edges_expanded.csv","Data/source_nodes_core_expanded.csv","data/travel/travel_task_to_task.csv","data/travel/travel_base_to_task.csv","Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"):
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"),name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Replicate four-way 100k exact-score comparison
        run: python -m la_grid.diagnostics.ga_schedule_aware_lns_repair_v2_20261010 --seed ${{ matrix.seed }} --budget 100000
      - name: Preserve complete 92-station sequences, objective and algorithmic decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-lns-repair-v2-confirm-s${{ matrix.seed }}
          path: results/diagnostics/ga_scheduling_aware_lns_20261010/repair_v2/
          if-no-files-found: warn
          retention-days: 21
