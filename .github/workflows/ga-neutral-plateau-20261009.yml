name: GA plateau equivalence - neutral drift versus GA
on:
  push:
    branches:
      - diagnostics/ga-algorithm-interaction-and-alternatives-20261009
    paths:
      - .github/workflows/ga-neutral-plateau-20261009.yml
      - src/la_grid/diagnostics/ga_neutral_plateau_20261009.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neutral:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [500,501,502,503,504,505,506,507,508,509,510,511,512,513,514,515,516,517,518,519]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Restore frozen objective inputs only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for name in ("Data/JULY_UTILITY_CONSTRAINED_92.csv",
                       "Data/substation_graph_CEC_edges_expanded.csv",
                       "Data/source_nodes_core_expanded.csv",
                       "data/travel/travel_task_to_task.csv",
                       "data/travel/travel_base_to_task.csv",
                       "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"):
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"),name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned scientific runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Search the neutral-phenotype plateau in four ways plus GA
        run: python -m la_grid.diagnostics.ga_neutral_plateau_20261009 --seed ${{ matrix.seed }} --budget 100000
      - name: Retain source-equivalent full chromosomes and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-plateau-s${{ matrix.seed }}
          path: results/diagnostics/ga_deeper_research_20261009/plateau_neutral/
          if-no-files-found: warn
          retention-days: 21
