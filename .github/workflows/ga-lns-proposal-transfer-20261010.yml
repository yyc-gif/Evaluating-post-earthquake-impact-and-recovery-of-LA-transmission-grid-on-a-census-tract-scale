name: LNS source-reconnection proposal transfer mechanism (no optimizer)
on:
  push:
    branches:
      - diagnostics/scheduling-aware-lns-20261010
    paths:
      - .github/workflows/ga-lns-proposal-transfer-20261010.yml
      - src/la_grid/diagnostics/ga_lns_proposal_transfer_20261010.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [1000,1001,1002,1003,1004,1005,1006,1007]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Retrieve only frozen objective inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned scientific Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Compare matched event-bundle candidate proposals at two fixed baselines
        run: |
          python -m py_compile src/la_grid/diagnostics/ga_lns_proposal_transfer_20261010.py
          python -m la_grid.diagnostics.ga_lns_proposal_transfer_20261010 --seed ${{ matrix.seed }}
      - name: Preserve original-sample versus all64 proposal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-lns-transfer-s${{ matrix.seed }}
          path: results/diagnostics/ga_scheduling_aware_lns_20261010/proposal_transfer/
          if-no-files-found: warn
          retention-days: 21
