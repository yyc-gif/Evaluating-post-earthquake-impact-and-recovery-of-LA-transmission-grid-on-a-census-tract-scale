name: Scheduling-aware LNS vs random LNS, GA and ILS
on:
  push:
    branches:
      - diagnostics/scheduling-aware-lns-20261010
    paths:
      - .github/workflows/ga-scheduling-aware-lns-20261010.yml
      - src/la_grid/diagnostics/ga_schedule_aware_lns_20261010.py
  workflow_dispatch:
permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [800, 801, 802, 803]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Materialize exactly the frozen GA planning inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for name in ("Data/JULY_UTILITY_CONSTRAINED_92.csv",
                       "Data/substation_graph_CEC_edges_expanded.csv",
                       "Data/source_nodes_core_expanded.csv",
                       "data/travel/travel_task_to_task.csv",
                       "data/travel/travel_base_to_task.csv",
                       "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"):
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"),name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install science dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Verify schedule-network LNS candidates and four-way budget parity
        run: |
          python -m py_compile src/la_grid/diagnostics/ga_schedule_aware_lns_20261010.py
          python -m la_grid.diagnostics.ga_schedule_aware_lns_20261010 --seed ${{ matrix.seed }} --budget 20000
      - name: Upload smoke output including full chromosomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-lns-smoke-s${{ matrix.seed }}
          path: results/diagnostics/ga_scheduling_aware_lns_20261010/
          if-no-files-found: warn
          retention-days: 21

  confirm:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [820,821,822,823,824,825,826,827,828,829,830,831,832,833,834,835,836,837,838,839]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Materialize unchanged scheduling/graph/planning authority
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for name in ("Data/JULY_UTILITY_CONSTRAINED_92.csv",
                       "Data/substation_graph_CEC_edges_expanded.csv",
                       "Data/source_nodes_core_expanded.csv",
                       "data/travel/travel_task_to_task.csv",
                       "data/travel/travel_base_to_task.csv",
                       "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"):
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"),name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Compare four algorithms at 100k per algorithm
        run: python -m la_grid.diagnostics.ga_schedule_aware_lns_20261010 --seed ${{ matrix.seed }} --budget 100000
      - name: Upload per-seed evidence and full priority sequences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-lns-confirm-s${{ matrix.seed }}
          path: results/diagnostics/ga_scheduling_aware_lns_20261010/
          if-no-files-found: warn
          retention-days: 21
