name: SCE supported capacity-ceiling closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloud-checkout-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile closure and verify formal evaluator
        run: |
          python -m py_compile run_sce_capacity_supported_sensitivity.py sce_capacity_closure.py
          python -m unittest test_r1_formal_offline.py

      - name: Refuse cloud rerun without frozen vulnerability archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Formal_Experiment_20260923/Equity_Amendment/T/2pc50/C57_D1"
          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::The complete frozen vulnerability-first station-trajectory archive is not in GitHub. Do not reschedule it in Actions. Run run_sce_capacity_supported_sensitivity.py only in the retained local project workspace where $ARCHIVE exists."
            exit 1
          fi
          python run_sce_capacity_supported_sensitivity.py
