name: GA initialization and hyperparameter audit (diagnostic only)

on:
  push:
    branches:
      - diagnostics/ga-initialization-and-hyperparameters-20261009
    paths:
      - .github/workflows/ga-initialization-param-20261009.yml
      - src/la_grid/diagnostics/ga_init_param_20261009.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-seed-comparisons:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [42, 43, 44, 45, 46]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out diagnostic branch without downloading all LFS files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Pull only frozen GA objective inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          paths = [
              "Data/JULY_UTILITY_CONSTRAINED_92.csv",
              "Data/substation_graph_CEC_edges_expanded.csv",
              "Data/source_nodes_core_expanded.csv",
              "data/travel/travel_task_to_task.csv",
              "data/travel/travel_base_to_task.csv",
              "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv",
          ]
          for name in paths:
              content = Path(name).read_bytes()[:50]
              assert not content.startswith(b"version https://git-lfs"), name
          print("Required LFS files materialized")
          PY

      - name: Install pinned scientific runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .

      - name: Run initialization ablations first
        run: python -m la_grid.diagnostics.ga_init_param_20261009 --seed ${{ matrix.seed }} --budget 20000 --phase initialization

      - name: Then test other optional hyperparameters
        run: python -m la_grid.diagnostics.ga_init_param_20261009 --seed ${{ matrix.seed }} --budget 20000 --phase parameters

      - name: Upload output records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-parameter-followup-s${{ matrix.seed }}
          path: results/diagnostics/ga_parameter_followup_20261009/
          if-no-files-found: warn
          retention-days: 14
