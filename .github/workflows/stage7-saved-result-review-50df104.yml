name: Review saved Stage7 results without refitting
on:
  push:
    branches: [analysis/stage7-decision-review-50df104-20261010]
    paths:
      - .github/workflows/stage7-saved-result-review-50df104.yml
      - docs/data_research/built_environment_20261009/decision_review_50df104_20261010/review_saved_results.py
permissions:
  contents: write
concurrency:
  group: stage7-review-50df104
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Hydrate only seven existing result tables
        run: |
          git lfs install --local
          P='docs/data_research/built_environment_20261009/final_feature_validation_20261010'
          git lfs pull --include="$P/FINAL_CANDIDATE_FEATURE_MATRIX.csv,$P/CONTROLLED_CLUSTERING_COMPARISON.csv,$P/SPATIAL_BLOCK_STABILITY.csv,$P/CLUSTER_DOMAIN_CONTRIBUTIONS.csv,$P/EXPLORATORY_LABELS_SEED42.csv,$P/CLUSTER_BETWEEN_MODEL_ARI.csv,$P/CANDIDATE_VIF.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical read-and-review dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.14.1 scikit-learn==1.5.1
      - name: Verify stored metrics and report profiles
        run: |
          python -m py_compile docs/data_research/built_environment_20261009/decision_review_50df104_20261010/review_saved_results.py
          python docs/data_research/built_environment_20261009/decision_review_50df104_20261010/review_saved_results.py
      - name: Retain review results
        uses: actions/upload-artifact@v4
        with:
          name: saved-stage7-decision-review
          path: docs/data_research/built_environment_20261009/decision_review_50df104_20261010/SAVED_RESULTS_REVIEW.*
          if-no-files-found: error
      - name: Publish only new review notes to separate branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data_research/built_environment_20261009/decision_review_50df104_20261010/SAVED_RESULTS_REVIEW.json docs/data_research/built_environment_20261009/decision_review_50df104_20261010/SAVED_RESULTS_REVIEW.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'review: record independent saved-metric checks and profiles [skip ci]'
          git push origin HEAD:analysis/stage7-decision-review-50df104-20261010
