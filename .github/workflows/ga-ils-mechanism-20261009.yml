name: Audit ILS-vs-GA influential planning sample through exact scheduler
on:
  push:
    branches:
      - diagnostics/ga-algorithm-interaction-and-alternatives-20261009
    paths:
      - .github/workflows/ga-ils-mechanism-20261009.yml
      - src/la_grid/diagnostics/ga_ils_mechanism_20261009.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Pull only frozen physical planning input and travel CSV
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Compare all 64 frozen task schedules, focus on realization 15
        run: python -m la_grid.diagnostics.ga_ils_mechanism_20261009
      - name: Export exact event-level mechanism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-ils-outlier-mechanism
          path: results/diagnostics/ga_deeper_research_20261009/ILS_SCHEDULE_INFLUENCE_MECHANISM.json
          if-no-files-found: warn
          retention-days: 21
