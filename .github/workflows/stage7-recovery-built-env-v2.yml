name: Stage 7 recovery and built environment independent audit

on:
  push:
    branches:
      - analysis/stage7-recovery-built-env-v2-20261009
    paths:
      - .github/workflows/stage7-recovery-built-env-v2.yml
      - docs/data_research/built_environment_20261009/recluster_20261009/revision_v2/*.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/stage7-recovery-built-env-v2-20261009
          fetch-depth: 1
          lfs: false
      - name: Fetch exact LFS source tables
        run: |
          git lfs install --local
          git lfs pull --include="Formal_Experiment_20260923/Stage 7 Output_SOVI_Harmonized/clusters_labels_final.csv,docs/data_research/built_environment_20261009/validation/ACS_TRACT_VALIDATION.csv,docs/data_research/built_environment_20261009/validation/NLCD_TRACT_EXTRACTION.csv,Data/NRI_Table_CensusTracts_California.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible requirements
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.14.1 scikit-learn==1.5.2
      - name: Compute actual NRI and urban density correlations
        run: |
          python -m py_compile docs/data_research/built_environment_20261009/recluster_20261009/revision_v2/feature_audit.py
          python docs/data_research/built_environment_20261009/recluster_20261009/revision_v2/feature_audit.py
      - name: Upload verified audit package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-built-env-v2-feature-audit
          path: docs/data_research/built_environment_20261009/recluster_20261009/revision_v2/results
          if-no-files-found: error
      - name: Commit new audit outputs only
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_research/built_environment_20261009/recluster_20261009/revision_v2/results
          git diff --cached --quiet && exit 0
          git commit -m "results: independently audit NRI and urban-form feature correlations [skip ci]"
          git push origin HEAD:analysis/stage7-recovery-built-env-v2-20261009
