name: Cold-start GA vs ILS internal planning 48-16 crossfit
on:
  push:
    branches:
      - diagnostics/ga-algorithm-interaction-and-alternatives-20261009
    paths:
      - .github/workflows/ga-crossfit-20261009.yml
      - src/la_grid/diagnostics/ga_crossfit_optimizer_20261009.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossfit:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        fold: [0,1,2,3]
        seed: [600,601,602,603,604]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Retrieve frozen July92/2pc50 planning inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Fit two optimizers on 48 samples and compare other 16
        run: python -m la_grid.diagnostics.ga_crossfit_optimizer_20261009 --fold ${{ matrix.fold }} --seed ${{ matrix.seed }}
      - name: Archive complete sequences and per-fold train/test losses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-crossfit-fold${{ matrix.fold }}-s${{ matrix.seed }}
          path: results/diagnostics/ga_deeper_research_20261009/crossfit/
          if-no-files-found: warn
          retention-days: 21
