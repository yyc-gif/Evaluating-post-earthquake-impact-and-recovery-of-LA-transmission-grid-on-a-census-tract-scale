name: Stage 7 EAL B-versus-D initialization stability

on:
  push:
    branches:
      - analysis/stage7-eal-initialization-stability-20261010
    paths:
      - .github/workflows/stage7-eal-initialization-stability.yml
      - docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_initialization_stability.py
      - docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_equal_domain_stability.py

permissions:
  contents: write

concurrency:
  group: stage7-eal-init-stability
  cancel-in-progress: true

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/stage7-eal-initialization-stability-20261010
          fetch-depth: 1
          lfs: false
      - name: Download only two archived LFS tables
        run: |
          git lfs install --local
          git lfs pull --include="docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/MATCHED_FEMA_STAGE7_FEATURES.csv,Formal_Experiment_20260923/Stage 7 Output_SOVI_Harmonized/clusters_labels_final.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned statistical environment
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.14.1 scikit-learn==1.5.1
      - name: Run B/D repeated-restart test
        run: |
          python -m py_compile docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_initialization_stability.py
          python docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_initialization_stability.py
          python -m py_compile docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_equal_domain_stability.py
          python docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/test_equal_domain_stability.py
      - name: Save all independent output
        uses: actions/upload-artifact@v4
        with:
          name: stage7-B-D-initialization-20seed
          path: docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/results
          if-no-files-found: error
      - name: Commit new results only to analysis branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/followup_20261010/results
          git diff --cached --quiet && exit 0
          git commit -m "results: measure repeated initialization stability of EAL models [skip ci]"
          git push origin HEAD:analysis/stage7-eal-initialization-stability-20261010
