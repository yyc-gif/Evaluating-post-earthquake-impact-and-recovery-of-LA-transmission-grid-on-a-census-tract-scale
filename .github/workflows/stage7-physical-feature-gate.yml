name: Stage7 independent physical-form feature gate
on:
  push:
    branches: [analysis/stage7-physical-feature-gate-20261010]
    paths:
      - .github/workflows/stage7-physical-feature-gate.yml
      - docs/data_research/built_environment_20261009/physical_feature_gate_20261010/analyze.py
permissions:
  contents: write
concurrency:
  group: stage7-physical-gate-20261010
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/stage7-physical-feature-gate-20261010
          fetch-depth: 1
          lfs: false
      - name: Hydrate verified Stage 7 candidate matrices
        run: |
          git lfs install --local
          git lfs pull --include="docs/data_research/built_environment_20261009/local_joint_feature_extraction_20261009/RESIDENTIAL_2291_FEATURE_MATRIX.csv,docs/data_research/built_environment_20261009/local_joint_feature_extraction_20261009/FEATURE_CORRELATION_MATRIX.csv,docs/data_research/built_environment_20261009/local_joint_feature_extraction_20261009/FEATURE_COVERAGE_QA.csv,docs/data_research/built_environment_20261009/nri_eal_redundancy_audit_20261009/MATCHED_FEMA_STAGE7_FEATURES.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible analysis dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.14.1
      - name: Audit physical feature redundancy and coverage
        run: |
          python -m py_compile docs/data_research/built_environment_20261009/physical_feature_gate_20261010/analyze.py
          python docs/data_research/built_environment_20261009/physical_feature_gate_20261010/analyze.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: stage7-physical-gate
          path: docs/data_research/built_environment_20261009/physical_feature_gate_20261010/results
          if-no-files-found: error
      - name: Commit only newly calculated diagnostics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_research/built_environment_20261009/physical_feature_gate_20261010/results
          git diff --cached --quiet && exit 0
          git commit -m "results: independent physical-domain Stage7 feature gate [skip ci]"
          git push origin HEAD:analysis/stage7-physical-feature-gate-20261010
