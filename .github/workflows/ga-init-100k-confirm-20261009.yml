name: GA initialization fractions - 100k cross-budget confirmation

on:
  push:
    branches:
      - diagnostics/ga-initialization-and-hyperparameters-20261009
    paths:
      - .github/workflows/ga-init-100k-confirm-20261009.yml
      - src/la_grid/diagnostics/ga_initialization_budget_confirm_20261009.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-budget-initialization:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [100,101,102,103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Materialize pinned GA input CSVs only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          for path in (
              "Data/JULY_UTILITY_CONSTRAINED_92.csv",
              "Data/substation_graph_CEC_edges_expanded.csv",
              "Data/source_nodes_core_expanded.csv",
              "data/travel/travel_task_to_task.csv",
              "data/travel/travel_base_to_task.csv",
              "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv",
          ):
              assert not Path(path).read_bytes().startswith(b"version https://git-lfs"),path
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .
      - name: Run 100k objective evaluations per specified initialization
        run: python -m la_grid.diagnostics.ga_initialization_budget_confirm_20261009 --seed ${{ matrix.seed }} --budget 100000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-init-100k-s${{ matrix.seed }}
          path: results/diagnostics/ga_initialization_100k_confirmation_20261009/
          if-no-files-found: warn
          retention-days: 21
