name: Stage 7 pre-event reclustering validation

on:
  push:
    branches:
      - analysis/stage7-pre-event-reclustering-20261009
    paths:
      - .github/workflows/stage7-pre-event-typology.yml
      - docs/data_research/built_environment_20261009/recluster_20261009/recluster.py
      - docs/data_research/built_environment_20261009/recluster_20261009/source_qa.py

permissions:
  contents: write

jobs:
  recluster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/stage7-pre-event-reclustering-20261009
          fetch-depth: 1
          lfs: false
      - name: Pull only necessary previously audited LFS data
        run: |
          git lfs install --local
          git lfs pull --include="Formal_Experiment_20260923/Stage 7 Output_SOVI_Harmonized/clusters_labels_final.csv,docs/data_research/built_environment_20261009/validation/ACS_TRACT_VALIDATION.csv,docs/data_research/built_environment_20261009/validation/NLCD_TRACT_EXTRACTION.csv,docs/data_research/built_environment_20261009/validation/sources/B25024_06.csv.zip,docs/data_research/built_environment_20261009/validation/sources/B25034_06.csv.zip"
          ls -lh "Formal_Experiment_20260923/Stage 7 Output_SOVI_Harmonized/clusters_labels_final.csv" "docs/data_research/built_environment_20261009/validation/ACS_TRACT_VALIDATION.csv" "docs/data_research/built_environment_20261009/validation/NLCD_TRACT_EXTRACTION.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible analysis environment
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.14.1 scikit-learn==1.5.2
      - name: Validate syntax and run independent clustering
        run: |
          python -m py_compile docs/data_research/built_environment_20261009/recluster_20261009/recluster.py
          python -m py_compile docs/data_research/built_environment_20261009/recluster_20261009/source_qa.py
          python docs/data_research/built_environment_20261009/recluster_20261009/source_qa.py
          python docs/data_research/built_environment_20261009/recluster_20261009/recluster.py
      - name: Upload complete output even if branch write fails
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-pre-event-reclustering
          path: docs/data_research/built_environment_20261009/recluster_20261009/results/
          if-no-files-found: error
      - name: Commit new analysis outputs to isolated branch only
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_research/built_environment_20261009/recluster_20261009/results
          git diff --cached --quiet && exit 0
          git commit -m "results: independent Stage 7 pre-event reclustering [skip ci]"
          git push origin HEAD:analysis/stage7-pre-event-reclustering-20261009
