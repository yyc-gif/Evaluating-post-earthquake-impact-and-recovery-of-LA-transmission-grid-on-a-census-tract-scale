name: GA initialization fractions - fresh 30-seed robustness

on:
  push:
    branches:
      - diagnostics/ga-initialization-and-hyperparameters-20261009
    paths:
      - .github/workflows/ga-init-replication-20261009.yml
      - src/la_grid/diagnostics/ga_initialization_replication_20261009.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-initialization-allocations:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [100,101,102,103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120,121,122,123,124,125,126,127,128,129]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out isolated diagnostics
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Materialize frozen original objective inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Data/JULY_UTILITY_CONSTRAINED_92.csv,Data/substation_graph_CEC_edges_expanded.csv,Data/source_nodes_core_expanded.csv,Data/stage45_depot_inputs_final_origin_proxy.csv,Data/stage45_active_crew_bases_C57.csv,data/travel/travel_task_to_task.csv,data/travel/travel_base_to_task.csv,Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv"
          python - <<'PY'
          from pathlib import Path
          required=[
            "Data/JULY_UTILITY_CONSTRAINED_92.csv",
            "Data/substation_graph_CEC_edges_expanded.csv",
            "Data/source_nodes_core_expanded.csv",
            "data/travel/travel_task_to_task.csv",
            "data/travel/travel_base_to_task.csv",
            "Formal_Experiment_20260923/Stage 5 Output_expanded/INCUMBENT_DIRECT_SCORES_2pc50.csv",
          ]
          for name in required:
              assert not Path(name).read_bytes().startswith(b"version https://git-lfs"), name
          print("Frozen objective CSV inputs materialized.")
          PY

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact GA science dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.60.0 psutil==5.9.8
          python -m pip install -e .

      - name: Check diagnostics script and run fresh GA seed
        shell: bash
        run: |
          python -m py_compile src/la_grid/diagnostics/ga_initialization_replication_20261009.py
          python -m la_grid.diagnostics.ga_initialization_replication_20261009 --seed ${{ matrix.seed }} --budget 20000

      - name: Preserve per-seed raw experimental data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-init-replication-s${{ matrix.seed }}
          path: results/diagnostics/ga_initialization_replication_20261009/
          if-no-files-found: warn
          retention-days: 21
